name: Custom Workflow - Release Notes

# Trigger the workflow only when a new tag is pushed
on:
  push:
    tags:
      - '*'   # triggers on any new tag
  workflow_dispatch:  # allows manual run if needed

permissions:
  contents: read
  pull-requests: read

jobs:
  generate-release-notes:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Generate release notes for last 5 merged PRs
      - name: Generate release notes
        run: |
          echo "Release notes for tag $GITHUB_REF" > release-notes.txt
          # List last 5 merged PRs
          gh pr list --state merged --limit 5 --json number,title,mergedAt \
            | jq -r '.[] | "- PR #\(.number): \(.title)"' >> release-notes.txt

      # Step 3: Commit and push the release notes
      - name: Commit release notes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"
          git add release-notes.txt
          git commit -m "Update release notes for tag $GITHUB_REF" || echo "No changes to commit"
          git push origin HEAD
