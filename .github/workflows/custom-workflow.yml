name: Generate Release Notes

# Trigger workflow only when a new tag is pushed
on:
  push:
    tags:
      - 'v*'  # Runs on tags like v1.0, v2.0, etc.
  workflow_dispatch:  # Allow manual trigger

jobs:
  release_notes:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Generate release notes using Release Drafter
      - name: Generate Release Notes
        id: notes
        uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 3: Display the release notes in workflow logs
      - name: Show Release Notes
        run: echo "${{ steps.notes.outputs.release_body }}"
