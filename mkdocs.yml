site_name: Heavens Above Documentation
site_url: https://i233068-netizen.github.io/heavens-above-assignment

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - search.highlight

plugins:
  - search
  - awesome-pages

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - codehilite
  - footnotes
  - tables
  - attr_list
  - def_list

nav:
  - Home: index.md
  - Utilities: utils.md
  - New File: NewFile.md
  - Features: features.md
